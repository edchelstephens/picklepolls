name: Continuous Integration(CI) Test

on:
  pull_request:
    branches: [production]
  push:
    branches: [production]

jobs:
  run-unit-tests:
    runs-on: ubuntu-latest
    env:
      CICD: true
    strategy:
      max-parallel: 4
      matrix:
        python-version: ["3.13.5"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Firefox
        run: |
          sudo apt-get update
          sudo apt-get install -y firefox

      - name: Install geckodriver
        run: |
          sudo rm -f /usr/bin/geckodriver

          GECKODRIVER_VERSION=0.37.1

          wget -q "https://github.com/mozilla/geckodriver/releases/download/v${GECKODRIVER_VERSION}/geckodriver-v${GECKODRIVER_VERSION}-linux64.tar.gz"

          tar -xzf "geckodriver-v${GECKODRIVER_VERSION}-linux64.tar.gz"

          sudo mv geckodriver /usr/local/bin/geckodriver
          sudo chmod +x /usr/local/bin/geckodriver

      - name: Verify browser
        run: |
          firefox --version
          geckodriver --version
          which firefox
          which geckodriver

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r _requirements/test.txt

      - name: Print working directory and Tree
        run: |
          echo "Working Directory:"
          pwd

          echo "tree -L 1"
          tree -L 1

          echo "tree -L 2"
          tree -L 2

      - name: Run Pytest tests and Get Coverage Report
        working-directory: project
        env:
          DJANGO_SETTINGS_MODULE: picklepolls.settings
        run: |
          coverage run -m pytest -sv -m "not skip_on_ci"
          coverage report