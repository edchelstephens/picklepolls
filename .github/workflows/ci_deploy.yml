name: Continuous Integration Test and Continuous Deployment

on:
  push:
    branches: [production]

jobs:
  run-unit-tests:
    runs-on: ubuntu-latest

    env:
      CICD: true
      DEBUG: true
      DEBUG_MULTILINE: true
      SECRET_KEY: django-insecure-ui7r8@z1y^geibe_d&ixx(q8zn!_4k-9-dos4dle4)bi$ve%(@
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: localhost,127.0.0.1

    strategy:
      max-parallel: 4
      matrix:
        python-version: ["3.13.5"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify Firefox and geckodriver
        run: |
          echo "CICD=$CICD"
          echo "GECKOWEBDRIVER=$GECKOWEBDRIVER"

          firefox --version

          echo "Firefox:"
          which firefox
          readlink -f "$(which firefox)"

          echo "Geckodriver:"
          ls -la "$GECKOWEBDRIVER"
          "$GECKOWEBDRIVER/geckodriver" --version

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r _requirements/test.txt

      - name: Print working directory and Tree
        run: |
          echo "Working Directory:"
          pwd

          echo "tree -L 1"
          tree -L 1

          echo "tree -L 2"
          tree -L 2

      - name: Run Pytest tests and Get Coverage Report
        working-directory: project
        env:
          DJANGO_SETTINGS_MODULE: picklepolls.settings
        run: |
          coverage run -m pytest -sv -m "not skip_on_ci"
          coverage report

  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    needs: run-unit-tests

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            set -e

            echo "================"
            echo "Starting Production Deployment"
            echo "================"

            echo "================"
            echo "Current Directory:"
            pwd

            echo "================"
            echo "Moving to picklepolls directory"
            cd /home/ubuntu/picklepolls
            pwd


            echo "================"
            echo "Evaluating ssh keys and adding in order to pull to github"
            eval "$(ssh-agent -s)"
            ssh-add ~/.ssh/ed-alpha-server-v2


            echo "================"
            echo "Pulling latest production branch changes..."
            git pull

            echo "================"
            echo "Building the docker image..."
            sudo docker image build -f Dockerfile.prod -t picklepolls .

            echo "================"
            echo "Kill the current running container of picklepolls image if it exists..."
            if [ -n "$(sudo docker ps -q --filter ancestor=picklepolls)" ]; then sudo docker kill $(sudo docker ps -q --filter ancestor=picklepolls); else echo "No running picklepolls container detected."; fi

            echo "================"
            echo "Running a new container with the latest built image..."
            sudo docker run --env-file .env -d -p 8020:8000 picklepolls
