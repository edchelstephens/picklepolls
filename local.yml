name: picklepolls

services:
  django:
    image: picklepolls
    build:
      context: .
      dockerfile: Dockerfile

    env_file:
      - .env

    volumes:
      - ./project:/app/project

    ports:
      - "8020:8000"

    networks:
      - picklepolls

    restart: unless-stopped

networks:
  picklepolls:
    name: picklepolls_network
    driver: bridge
