name: picklepolls

services:
  django:
    image: picklepolls-django-image
    build:
      context: .
      dockerfile: Dockerfile

    env_file:
      - .env

    volumes:
      - ./project:/app/project

    ports:
      - "8020:8000"

    networks:
      - picklepolls-network

    restart: unless-stopped

networks:
  picklepolls-network:
    name: picklepolls-bridge-network
    driver: bridge
