name: picklepolls

services:
  traefik:
    image: traefik:v3.7.12
    container_name: picklepoll-traefik
    restart: unless-stopped

    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"

    ports:
      - "80:80"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    networks:
      - picklepolls-network

  db:
    image: postgres:18.6-bookworm
    container_name: picklepolls-postgres
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    networks:
      - picklepolls-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  django:
    image: picklepolls-image
    container_name: picklepolls-django

    build:
      context: .
      dockerfile: Dockerfile

    env_file:
      - .env

    volumes:
      - ./project:/app/project

    expose:
      - "8000"

    depends_on:
      db:
        condition: service_healthy

    networks:
      - picklepolls-network

    restart: unless-stopped

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.picklepolls.rule=Host(`localhost`)"
      - "traefik.http.routers.picklepolls.entrypoints=web"
      - "traefik.http.services.picklepolls.loadbalancer.server.port=8000"
      - "traefik.docker.network=picklepolls-bridge-network"

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: picklepolls-prometheus
    restart: unless-stopped

    volumes:
      - ./prometheus/prometheus.local.yml:/etc/prometheus/prometheus.yml:ro

    ports:
      - "9090:9090"

    networks:
      - picklepolls-network

    depends_on:
      - django

  loki:
    image: grafana/loki:3.7.7
    container_name: picklepolls-loki
    restart: unless-stopped

    command:
      - "-config.file=/etc/loki/loki-config.yaml"

    ports:
      - "3100:3100"

    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki

    networks:
      - picklepolls-network

  tempo:
    image: grafana/tempo:3.0.3
    container_name: picklepolls-tempo
    restart: unless-stopped

    command:
      - "-config.file=/etc/tempo/tempo.yaml"

    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo

    expose:
      - "3200"
      - "4317"
      - "4318"

    networks:
      - picklepolls-network

  alloy:
    image: grafana/alloy:v1.19.2
    container_name: picklepolls-alloy
    restart: unless-stopped

    command:
      - "run"
      - "/etc/alloy/config.alloy"
      - "--server.http.listen-addr=0.0.0.0:12345"

    ports:
      - "12345:12345"

    expose:
      - "4317"
      - "4318"

    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy

    networks:
      - picklepolls-network

    depends_on:
      - loki
      - tempo

  grafana:
    image: grafana/grafana:13.2.1
    container_name: picklepolls-grafana
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "3000:3000"

    volumes:
      - grafana_data:/var/lib/grafana

    networks:
      - picklepolls-network

    depends_on:
      - prometheus
      - loki
      - tempo

volumes:
  postgres_data:
  grafana_data:
  loki_data:
  alloy_data:
  tempo_data:

networks:
  picklepolls-network:
    name: picklepolls-bridge-network
    driver: bridge
