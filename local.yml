name: picklepolls

services:
  traefik:
    image: traefik:v3.7.12
    container_name: picklepoll-traefik
    restart: always

    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    networks:
      - picklepolls-network

  db:
    image: postgres:18.6-bookworm
    container_name: picklepolls-postgres
    restart: always

    env_file:
      - .env

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    networks:
      - picklepolls-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  django:
    image: picklepolls-image
    container_name: picklepolls-django

    build:
      context: .
      dockerfile: Dockerfile

    env_file:
      - .env

    volumes:
      - ./project:/app/project

    expose:
      - "8000"

    depends_on:
      db:
        condition: service_healthy

    networks:
      - picklepolls-network

    restart: always

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.picklepolls.rule=Host(`localhost`)"
      - "traefik.http.routers.picklepolls.entrypoints=web"
      - "traefik.http.services.picklepolls.loadbalancer.server.port=8000"
      - "traefik.docker.network=picklepolls-bridge-network"

volumes:
  postgres_data:

networks:
  picklepolls-network:
    name: picklepolls-bridge-network
    driver: bridge
