<!DOCTYPE html>
<html>
    <head>
        <title>Question {{question.id}} Details</title>
    </head>
    <body>
            
        <h1>{{question.question_text}}</h1>
        <ul>
        {% for choice in question.choice_set.all %}
            <li>{{choice.choice_text}} - {{choice.votes}} vote{% if choice.votes != 1 %}s{%endif%}</li>
        {% endfor %}
        </ul>
    </body>
</html>
