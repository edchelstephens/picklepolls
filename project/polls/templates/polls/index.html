<!DOCTYPE html>
<html>
    <head>
        <title>Polls</title>
    </head>
    <body>
    {% if latest_question_list %}
        <div>
            <h1>Polls Page</h1>
            <ul>
                {% for question in latest_question_list %}
                    <li>
                        <a href="{% url 'polls:detail' question.id %}">{{ question.question_text }}</a>
                        <p>Choices:{{question.total_choices}}</p>
                        <p>Votes:{{question.total_votes}}</p></p>
                    </li>
                {% endfor %}
            </ul>

        </div>
    {% else %}
        <p>No polls are available.</p>
    {% endif %}
    </body>
</html>
