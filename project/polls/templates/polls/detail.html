{% extends "polls/base.html"%}

{% block title %} Poll {{ question.pk }} | Vote {% endblock title %}

{% block main_content %}
<!-- Top nav link and Badge -->
 <div class="mb-4 flex items-center justify-between">
    <a href="{% url 'polls:index'%}"
        class="inline-flex items-center gap-2 text-xs font-bold text-green-700 transition hover:text-green-900"
    >
        <span class="text-sm">←</span> Back to Polls
    </a>
    {% if question.is_active %}
    <span class="rounded-full bg-green-100 px-3 py-1 text-[10px] font-black uppercase tracking-wider text-green-700">
        🟢 Active Poll
    </span>
    {% endif %}
</div>

{% endblock main_content %}

{% block footer_callout %}

{% endblock footer_callout %}
