name: Continuous Integration Test and Continuous Deployment

on:
  pull_request:
    branches: [production]
  push:
    branches: [production]

jobs:
  run-unit-tests:
    runs-on: ubuntu-latest

    env:
      CICD: true
      DEBUG: true
      DEBUG_MULTILINE: true
      SECRET_KEY: django-insecure-ui7r8@z1y^geibe_d&ixx(q8zn!_4k-9-dos4dle4)bi$ve%(@
      ALLOWED_HOSTS: localhost,127.0.0.1

    strategy:
      max-parallel: 4
      matrix:
        python-version: ["3.13.5"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify Firefox and geckodriver
        run: |
          echo "CICD=$CICD"
          echo "GECKOWEBDRIVER=$GECKOWEBDRIVER"

          firefox --version

          echo "Firefox:"
          which firefox
          readlink -f "$(which firefox)"

          echo "Geckodriver:"
          ls -la "$GECKOWEBDRIVER"
          "$GECKOWEBDRIVER/geckodriver" --version

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r _requirements/test.txt

      - name: Print working directory and Tree
        run: |
          echo "Working Directory:"
          pwd

          echo "tree -L 1"
          tree -L 1

          echo "tree -L 2"
          tree -L 2

      - name: Run Pytest tests and Get Coverage Report
        working-directory: project
        env:
          DJANGO_SETTINGS_MODULE: picklepolls.settings
        run: |
          coverage run -m pytest -sv -m "not skip_on_ci"
          coverage report

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    needs: run-unit-tests

    if: github.event_name == 'push' && github.ref == 'refs/heads/production'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e

            echo "======================================"
            echo "Starting Production Deployment"
            echo "======================================"

            echo "Server:"
            hostname

            echo "Current directory:"
            pwd

            echo "--------------------------------------"
            echo "Moving to project directory"
            echo "--------------------------------------"

            cd ${{ secrets.DEPLOY_PATH }}

            echo "Deployment path:"
            pwd

            echo "--------------------------------------"
            echo "Updating repository"
            echo "--------------------------------------"

            git fetch origin production
            git reset --hard origin/production

            echo "--------------------------------------"
            echo "Activating virtual environment"
            echo "--------------------------------------"

            source venv/bin/activate

            echo "--------------------------------------"
            echo "Installing production dependencies"
            echo "--------------------------------------"

            pip install -r _requirements/prod.txt

            echo "--------------------------------------"
            echo "Running Django migrations"
            echo "--------------------------------------"

            cd project

            python manage.py migrate --noinput

            echo "--------------------------------------"
            echo "Collecting static files"
            echo "--------------------------------------"

            python manage.py collectstatic --noinput

            echo "--------------------------------------"
            echo "Restarting Gunicorn"
            echo "--------------------------------------"

            sudo systemctl restart gunicorn

            echo "--------------------------------------"
            echo "Checking Gunicorn status"
            echo "--------------------------------------"

            sudo systemctl is-active --quiet gunicorn

            echo "--------------------------------------"
            echo "Deployment completed successfully!"
            echo "--------------------------------------"

            sudo systemctl status gunicorn --no-pager
