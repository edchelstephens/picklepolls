<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Results | PicklePolls</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: '#0B1F33',
                        teal: '#0F766E'
                    }
                }
            }
        }
    </script>
</head>

<body class="min-h-screen bg-slate-50 text-slate-900">

    <!-- Navbar -->
    <nav class="border-b border-slate-200 bg-white">
        <div class="mx-auto max-w-6xl px-6 py-4">

            <a href="#" class="inline-flex items-center gap-2 text-sm font-semibold text-slate-600 hover:text-navy">
                ← Back to Polls
            </a>

        </div>
    </nav>


    <!-- Main -->
    <main class="mx-auto max-w-3xl px-6 py-12">


        <!-- Header -->
        <div class="mb-8">

            <div class="mb-5 flex h-14 w-14 items-center justify-center rounded-2xl bg-emerald-50 text-3xl">
                🏆
            </div>

            <p class="mb-3 text-sm font-bold uppercase tracking-widest text-teal-600">
                Poll Results
            </p>

            <h1 class="text-3xl font-bold leading-tight tracking-tight text-navy md:text-4xl">
                What time should Sunday games start?
            </h1>

        </div>


        <!-- Summary -->
        <div class="mb-8 flex items-center justify-between rounded-2xl border border-slate-200 bg-white p-5">

            <div>

                <p class="text-sm text-slate-500">
                    Total votes
                </p>

                <p class="mt-1 text-2xl font-bold text-navy">
                    42
                </p>

            </div>

            <div class="text-right">

                <p class="text-sm text-slate-500">
                    Leading choice
                </p>

                <p class="mt-1 font-bold text-teal-600">
                    4:00 PM 🎉
                </p>

            </div>

        </div>


        <!-- Results -->
        <div class="space-y-5">


            <!-- Winning Result -->
            <div class="rounded-2xl border-2 border-teal-500 bg-white p-5 shadow-sm">

                <div class="mb-3 flex items-center justify-between">

                    <div class="flex items-center gap-3">

                        <span class="text-xl">
                            🏆
                        </span>

                        <span class="font-bold text-navy">
                            4:00 PM
                        </span>

                    </div>

                    <span class="font-bold text-teal-600">
                        52%
                    </span>

                </div>


                <div class="h-3 overflow-hidden rounded-full bg-slate-100">

                    <div
                        class="h-full rounded-full bg-teal-600"
                        style="width: 52%;"
                    ></div>

                </div>


                <p class="mt-3 text-sm text-slate-500">
                    22 votes
                </p>

            </div>


            <!-- Result -->
            <div class="rounded-2xl border border-slate-200 bg-white p-5">

                <div class="mb-3 flex items-center justify-between">

                    <span class="font-semibold text-navy">
                        3:00 PM
                    </span>

                    <span class="font-semibold text-slate-600">
                        31%
                    </span>

                </div>


                <div class="h-3 overflow-hidden rounded-full bg-slate-100">

                    <div
                        class="h-full rounded-full bg-slate-400"
                        style="width: 31%;"
                    ></div>

                </div>


                <p class="mt-3 text-sm text-slate-500">
                    13 votes
                </p>

            </div>


            <!-- Result -->
            <div class="rounded-2xl border border-slate-200 bg-white p-5">

                <div class="mb-3 flex items-center justify-between">

                    <span class="font-semibold text-navy">
                        5:00 PM
                    </span>

                    <span class="font-semibold text-slate-600">
                        17%
                    </span>

                </div>


                <div class="h-3 overflow-hidden rounded-full bg-slate-100">

                    <div
                        class="h-full rounded-full bg-slate-400"
                        style="width: 17%;"
                    ></div>

                </div>


                <p class="mt-3 text-sm text-slate-500">
                    7 votes
                </p>

            </div>


        </div>


        <!-- Actions -->
        <div class="mt-8 flex flex-col gap-3 sm:flex-row">

            <a
                href="#"
                class="flex-1 rounded-2xl bg-navy px-6 py-4 text-center font-bold text-white transition hover:bg-slate-800"
            >
                Vote Again
            </a>

            <a
                href="#"
                class="flex-1 rounded-2xl border border-slate-300 bg-white px-6 py-4 text-center font-bold text-slate-700 transition hover:bg-slate-100"
            >
                Back to Polls
            </a>

        </div>


    </main>

</body>
</html>
