<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vote | PicklePolls</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pickle: {
                            50: '#F0FDF4',
                            100: '#DCFCE7',
                            200: '#BBF7D0',
                            300: '#86EFAC',
                            400: '#4ADE80',
                            500: '#22C55E',
                            600: '#16A34A',
                            700: '#15803D',
                            800: '#166534',
                            900: '#14532D',
                        },
                        lime: {
                            400: '#A3E635',
                            500: '#84CC16',
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="min-h-screen bg-[#F4FBF5] text-slate-900">

    <!-- Navigation (Identical to index.html) -->
    <nav class="border-b border-green-100 bg-white">
        <div class="mx-auto flex max-w-7xl items-center justify-between px-5 py-3 md:px-6">
            <!-- Brand -->
            <a href="#" class="flex items-center gap-3">
                <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-gradient-to-br from-green-500 to-lime-400 text-xl shadow-md shadow-green-200">
                    🎾
                </div>
                <div>
                    <h1 class="text-lg font-black tracking-tight text-green-900">
                        PicklePolls
                    </h1>
                    <p class="text-[11px] font-medium text-green-600">
                        Your community. Your voice.
                    </p>
                </div>
            </a>
        </div>
    </nav>

    <!-- Main Container (Aligned with max-w-7xl from index.html) -->
    <main class="mx-auto max-w-7xl px-5 py-6 md:px-6 md:py-8">

        <!-- TOP NAV LINK & BADGE -->
        <div class="mb-4 flex items-center justify-between">
            <a href="#" class="inline-flex items-center gap-2 text-xs font-bold text-green-700 transition hover:text-green-900">
                <span class="text-sm">←</span> Back to Polls
            </a>
            <span class="rounded-full bg-green-100 px-3 py-1 text-[10px] font-black uppercase tracking-wider text-green-700">
                🟢 Active Poll
            </span>
        </div>

        <!-- MAIN VOTING CARD -->
        <div class="relative overflow-hidden rounded-3xl border border-green-100 bg-white p-6 shadow-xl shadow-green-100/60 md:p-8">
            <div class="absolute left-0 top-0 h-2 w-full bg-gradient-to-r from-green-500 via-lime-400 to-yellow-300"></div>

            <!-- POLL TITLE & ENTITY HEADER -->
            <div class="mb-6 flex flex-col gap-4 border-b border-slate-100 pb-5 sm:flex-row sm:items-center sm:justify-between">
                <div class="flex items-center gap-3">
                    <img src="https://assets.reclub.co/group-avatars/154681.webp" alt="ACES" class="h-12 w-12 rounded-2xl object-cover shadow-sm">
                    <div>
                        <div class="flex items-center gap-2">
                            <p class="text-sm font-black text-green-950">ACES</p>
                            <span class="text-xs font-bold text-green-600">• Schedule</span>
                        </div>
                        <h2 class="text-xl font-black text-green-950 md:text-2xl leading-tight">
                            What time should Sunday games start?
                        </h2>
                    </div>
                </div>

                <div class="flex shrink-0 items-center justify-between gap-3 rounded-2xl bg-green-50 px-4 py-2 text-right sm:self-center">
                    <span class="text-xs font-semibold text-green-600">Total Votes</span>
                    <span class="text-lg font-black text-green-700 leading-none">42</span>
                </div>
            </div>

            <!-- FORM AND VERTICAL CHOICES -->
            <form action="#" method="post">
                <fieldset>
                    <legend class="sr-only">Poll choices</legend>

                    <div class="flex flex-col gap-3">
                        <!-- CHOICE 1 -->
                        <label class="group relative flex cursor-pointer items-center justify-between rounded-2xl border-2 border-slate-150 bg-slate-50/50 px-5 py-3.5 transition duration-200 hover:border-green-500 hover:bg-green-50/50">
                            <div class="flex items-center gap-3">
                                <input type="radio" name="choice" value="1" class="h-4 w-4 accent-green-600">
                                <div>
                                    <p class="text-base font-black text-green-950">3:00 PM</p>
                                    <p class="text-xs text-slate-500 leading-none">Start earlier and finish earlier.</p>
                                </div>
                            </div>
                            <span class="text-xl opacity-0 transition group-hover:opacity-100">🎾</span>
                        </label>

                        <!-- CHOICE 2 -->
                        <label class="group relative flex cursor-pointer items-center justify-between rounded-2xl border-2 border-slate-150 bg-slate-50/50 px-5 py-3.5 transition duration-200 hover:border-green-500 hover:bg-green-50/50">
                            <div class="flex items-center gap-3">
                                <input type="radio" name="choice" value="2" class="h-4 w-4 accent-green-600">
                                <div>
                                    <p class="text-base font-black text-green-950">4:00 PM</p>
                                    <p class="text-xs text-slate-500 leading-none">The current preferred schedule.</p>
                                </div>
                            </div>
                            <span class="text-xl opacity-0 transition group-hover:opacity-100">🎾</span>
                        </label>

                        <!-- CHOICE 3 -->
                        <label class="group relative flex cursor-pointer items-center justify-between rounded-2xl border-2 border-slate-150 bg-slate-50/50 px-5 py-3.5 transition duration-200 hover:border-green-500 hover:bg-green-50/50">
                            <div class="flex items-center gap-3">
                                <input type="radio" name="choice" value="3" class="h-4 w-4 accent-green-600">
                                <div>
                                    <p class="text-base font-black text-green-950">5:00 PM</p>
                                    <p class="text-xs text-slate-500 leading-none">A later start for players coming from work.</p>
                                </div>
                            </div>
                            <span class="text-xl opacity-0 transition group-hover:opacity-100">🎾</span>
                        </label>
                    </div>
                </fieldset>

                <!-- SUBMIT BUTTON -->
                <button type="submit" class="mt-6 flex w-full items-center justify-center gap-2 rounded-2xl bg-gradient-to-r from-green-600 to-green-500 px-6 py-4 text-sm font-black text-white shadow-lg shadow-green-200 transition hover:from-green-700 hover:to-green-600">
                    Submit My Vote
                    <span class="text-base">→</span>
                </button>

             
            </form>
        </div>

       

        <!-- FOOTER MESSAGE -->
        <div class="mt-8 rounded-3xl border border-green-100 bg-gradient-to-r from-green-50 to-lime-50 p-6 text-center">
            <div class="mb-2 text-3xl">🤝</div>
            <h3 class="text-lg font-black text-green-900">Every vote counts.</h3>
            <p class="mt-1 text-sm text-green-700">Your vote helps shape the next community decision.</p>
        </div>

        

    </main>

</body>

</html>
