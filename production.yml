name: picklepolls

services:
  django:
    image: picklepolls-django
    build:
      context: .
      dockerfile: Dockerfile.prod

    env_file:
      - .env

    ports:
      - "8020:8000"

    networks:
      - picklepolls-network

    restart: always

networks:
  picklepolls-network:
    name: picklepolls-network-bridge
    driver: bridge
