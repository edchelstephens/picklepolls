name: picklepolls

services:
  traefik:
    image: traefik:v3.7.12
    container_name: picklepolls-traefik
    restart: unless-stopped

    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.email=edchelstephens@gmail.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt

    networks:
      - picklepolls-network

  db:
    image: postgres:18.6-bookworm
    container_name: picklepolls-db
    restart: unless-stopped

    env_file:
      - .env

    volumes:
      - postgres_data:/var/lib/postgresql

    networks:
      - picklepolls-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  django:
    image: picklepolls-django-image
    container_name: picklepolls-django
    build:
      context: .
      dockerfile: Dockerfile.prod

    env_file:
      - .env

    environment:
      DJANGO_SETTINGS_MODULE: picklepolls.settings.production

    expose:
      - "8000"

    depends_on:
      db:
        condition: service_healthy

    networks:
      - picklepolls-network

    restart: unless-stopped

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.picklepolls.rule=Host(`picklepolls.go2courts.com`)"
      - "traefik.http.routers.picklepolls.entrypoints=websecure"
      - "traefik.http.routers.picklepolls.tls=true"
      - "traefik.http.routers.picklepolls.tls.certresolver=letsencrypt"
      - "traefik.http.services.picklepolls.loadbalancer.server.port=8000"
      - "traefik.docker.network=picklepolls-bridge-network"

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: picklepolls-prometheus
    restart: unless-stopped

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    expose:
      - "9090"

    networks:
      - picklepolls-network

    depends_on:
      - django

volumes:
  postgres_data:
  traefik_letsencrypt:

networks:
  picklepolls-network:
    name: picklepolls-bridge-network
    driver: bridge
